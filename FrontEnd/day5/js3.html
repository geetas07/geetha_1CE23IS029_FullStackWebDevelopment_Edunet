<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Enter name" id="orig"><br>
    <input type="text" placeholder="Reverse" id="rev"><br>
    <input type="button" value="Click here" onclick="reverse()"><br>
    <script>//reverse a string
        function reverse(){
            let name=document.getElementById("orig").value;
            let splname=name.split('').reverse().join('');
           
            document.getElementById("rev").value=splname;
        }
    </script>
</body>
</html>
