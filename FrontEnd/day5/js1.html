<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let n1=10;
    let n2=20;
    let n3=30;
    if(n1>=n2 && n1>=n3){
        console.log("n1 is lowest");
    }
    else if(n2>=n1 && n2>=n3){
        console.log("n2 is smallest"); 
    }       
    else{
        console.log("n3 is largest");
    }
    
    //while loop
    let j=1; 
    while(j<=10){
        console.log(j);
        j++;
    }

    //do while loop
    let k=1;
    do{
        console.log(k);
        k++;
    }
    while(k<=11);


    </script>
    
</body>
</html>
