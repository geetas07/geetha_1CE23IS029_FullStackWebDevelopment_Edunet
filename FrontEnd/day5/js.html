     <script>      //conditional statements
       let x=75;
       if(x>=90){
        console.log("S"); 
       }
        else if(x>=80){
          console.log("A+");
        }
        else if(x>=70){
          console.log("A");
         }
        else if(x>=60){
          console.log("B+");
        }
        else if(x>=50){
            console.log("B");
        }
        else if(x>=40){
          console.log("C");
         }
        
        else{
          console.log("Fail");
         }

//switch case
    let b=35;
         switch(b){
            case(b>=90):
                console.log("S");
                break;
            case (b>=80):
                console.log("A+");
                break;
            case (b>=70):
                console.log("A");
                break;
            case (b>=60):
                console.log("B+");
                break;
            case (b>=50):
                console.log("B");
                break;
            case (b>=40):
                console.log("C");
                break;
            default:
                console.log("Fail");
    }
