<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="fpara">this is my first paragraph</p>
    <p id="spara">this is my second paragraph</p>
    <p class="abc">this is my third paragraph</p>
    <p class="xyz">this is my fourth  paragraph</p>
    <pre>this is my 5th paragraph</pre>
    
 

    <style>
        #fpara {
            color: blue;
            font-size: 20px;
        }

        #spara {
            color: red;
            font-size: 25px;
        }
        .abc {
            color: green;
            font-size: 30px;
        }
        .xyz {
            color: orange;
            font-size: 35px;
        }
        * {
            color: purple;
            font-size: 40px;
        }




    </style>

</body>
</html>
